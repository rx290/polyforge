[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyforge"
version = "0.1.0"
description = "Offline, universal parametric CAD generation and validation -- works standalone or as a skill for any LLM"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
repair = ["trimesh>=4.0"]

[project.scripts]
polyforge = "polyforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
